[project]
name = "inkling-engine"
version = "0.1.0"
description = "Single-GPU Inkling-2-Mini inference engine tuned for the RTX 5090"
requires-python = ">=3.10"
dependencies = ["torch>=2.9", "triton>=3.5", "safetensors>=0.5", "tokenizers", "transformers"]

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]

[tool.setuptools]
packages = ["inkling_engine", "inkling_engine.ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/gpu"
