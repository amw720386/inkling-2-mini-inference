<!doctype html>
<!-- README GIF: one 4-request scheduler step, GPU busy vs Python bookkeeping. Rendered by ../render.js, then gif.sh.
     Measured: the GPU is idle about a third of each 4-request step (README "Behind",
     bench/experiments/sched_breakdown.py). Everything else on the timeline is schematic and labeled so.
     Throughput: results/serve_ours.json concurrency.4 453.9, serve_ours-fp8.json 473.9 (rounded 454 / 474 in the
     README), serve_sglang.json 545. Host work per step: Scheduler._batched_step in inkling_engine/scheduler.py. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../theme.css">
<style>html, body { margin: 0; background: var(--bg); overflow: hidden } svg { display: block }</style>
</head><body>
<script src="../lib/scene.js"></script>
<script src="../diagrams/diag.js"></script>
<script>
  const VW = 960, VH = 540;
  let P;
  const DUR = 9.0, STEPS = 3, X0 = 150, X1 = 900, STEP = (X1 - X0) / STEPS, BUSY = 2 / 3;
  const T0 = 0.6, T1 = 6.3;                       // the playhead sweeps the three steps in this window
  window.SCENE = { duration: DUR, ready: (async () => {
    await document.fonts.load('300 20px Inter'); await document.fonts.load('400 20px Inter'); await document.fonts.load('400 20px JBMono');
    P = D.palette(false);
  })() };

  window.renderFrame = t => {
    const { el, text, rect, F, para } = D;
    document.querySelector('svg')?.remove();
    const s = D.svg(P, VW, VH, { pxW: S.W, pxH: S.H });
    // fade everything dynamic out at the end so the loop restarts from the empty lanes
    const out = 1 - S.ramp(t, DUR - 0.7, 0.5);
    s.appendChild(text(48, 58, 'SCHEDULER · 4 CONCURRENT REQUESTS', F.label(13), P.muted));
    s.appendChild(text(48, 100, 'The GPU idles about a third of each step.', F.head(34), P.text));
    s.appendChild(text(48, 132, 'Python bookkeeping between graph replays. 454-474 tok/s here, 545 on SGLang.', F.light(17), P.body));

    const lanes = [['GPU', 212], ['PYTHON', 318]], lh = 54;
    for (const [name, y] of lanes) {
      s.appendChild(text(48, y + lh / 2 + 5, name, F.label(13), P.muted));
      s.appendChild(rect(X0, y, X1 - X0, lh, { rx: 6, fill: P.bg_card, stroke: P.border }));
    }
    const ph = X0 + (X1 - X0) * S.clamp((t - T0) / (T1 - T0));   // playhead x
    const clip = (a, b) => [a, Math.min(b, ph)];
    const g = el('g', { opacity: out.toFixed(3) });
    const hatch = el('pattern', { id: 'h', width: 7, height: 7, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
      [el('line', { x1: 0, y1: 0, x2: 0, y2: 7, stroke: P.dim, 'stroke-width': 2 })]);
    s.appendChild(el('defs', {}, [hatch]));
    for (let k = 0; k < STEPS; k++) {
      const a = X0 + k * STEP, m = a + STEP * BUSY, b = a + STEP;
      // GPU: graph replay, then idle
      let [x, e] = clip(a + 2, m - 1);
      if (e > x) {
        g.appendChild(rect(x, 214, e - x, lh - 4, { rx: 4, fill: P.blue, fo: 0.9 }));
      }
      [x, e] = clip(m + 1, b - 2);
      if (e > x) {
        g.appendChild(rect(x, 214, e - x, lh - 4, { rx: 4, fill: 'url(#h)', stroke: P.dim, sw: 1, dash: '3 3' }));
        if (e - x > 50) g.appendChild(text(x + (b - m) / 2 - 1, 244, 'idle', F.body(14), P.muted, { anchor: 'middle' }));
      }
      // Python: launches the replay, waits on the sync, then does the per-request work
      [x, e] = clip(a + 2, a + 18);
      if (e > x) g.appendChild(rect(x, 320, e - x, lh - 4, { rx: 4, fill: P.orange, fo: 0.9 }));
      [x, e] = clip(a + 20, m - 1);
      if (e > x) {
        g.appendChild(rect(x, 320, e - x, lh - 4, { rx: 4, stroke: P.border, sw: 1, dash: '3 3' }));
      }
      [x, e] = clip(m + 1, b - 2);
      if (e > x) {
        g.appendChild(rect(x, 320, e - x, lh - 4, { rx: 4, fill: P.orange, fo: 0.9 }));
      }
      // step ticks
      g.appendChild(el('path', { d: `M${a} 200 L${a} 376`, stroke: P.dim, 'stroke-width': 1, opacity: ph >= a ? 1 : 0 }));
      if (ph >= a) g.appendChild(text(a + 4, 196, 'STEP ' + (k + 1), F.label(10.5), P.dim));
    }
    // legend
    const ly = 404;
    const sw = (x, y, o) => s.appendChild(rect(x, y - 11, 14, 14, { rx: 3, ...o }));
    sw(X0, ly, { fill: P.blue, fo: 0.9 }); s.appendChild(text(X0 + 22, ly, 'CUDA graph replay, 4 requests', F.body(14), P.body));
    sw(X0 + 290, ly, { fill: 'url(#h)', stroke: P.dim, sw: 1, dash: '3 3' }); s.appendChild(text(X0 + 312, ly, 'GPU idle', F.body(14), P.body));
    sw(X0, ly + 26, { fill: P.orange, fo: 0.9 }); s.appendChild(text(X0 + 22, ly + 26, 'Python: launch the replay; after the sync, pick 4 tokens, stream them, admit, prepare the next step', F.body(14), P.body));
    sw(X0 + 420, ly, { stroke: P.muted, sw: 1, dash: '3 3' }); s.appendChild(text(X0 + 442, ly, 'Python waits on the GPU', F.body(14), P.body));
    // playhead
    if (t > T0 && t < T1 + 0.1) g.appendChild(el('path', { d: `M${ph} 204 L${ph} 374`, stroke: P.text, 'stroke-width': 1.5, opacity: 0.8 }));
    s.appendChild(g);

    // the measured share, called out over the last step's gap
    const ka = S.ramp(t, T1 + 0.1, 0.4) * out;
    const a3 = X0 + 2 * STEP, m3 = a3 + STEP * BUSY, b3 = a3 + STEP;
    const call = el('g', { opacity: ka.toFixed(3) });
    call.appendChild(el('path', { d: `M${m3 + 1} 274 L${m3 + 1} 280 L${b3 - 2} 280 L${b3 - 2} 274`,
      fill: 'none', stroke: P.text, 'stroke-width': 1.3 }));
    call.appendChild(text((m3 + b3) / 2, 297, 'about a third', F.body(14), P.text, { anchor: 'middle', halo: P.bg }));
    call.appendChild(text((m3 + b3) / 2, 312, 'MEASURED', F.label(10), P.muted, { anchor: 'middle', halo: P.bg }));
    s.appendChild(call);
    const kn = S.ramp(t, T1 + 0.5, 0.4) * out;
    s.appendChild(text(X0, 470, 'Next: move this work off the GPU\u2019s critical path.', F.body(16), P.text, { opacity: kn.toFixed(3) }));
    s.appendChild(text(48, 514, 'Schematic timeline. The one-third share is measured on an RTX PRO 6000 (bench/experiments/sched_breakdown.py).',
      F.body(12.5), P.muted));
    document.body.appendChild(s);
  };
</script>
</body></html>
