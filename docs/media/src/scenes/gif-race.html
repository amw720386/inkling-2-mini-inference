<!-- README race GIF (960x540): the same race as scene 2, scaled for a GIF. Scene 2: Every bar step, timer value and character comes from race/race-data.js, which

     scene time t maps to request time t - T0; nothing is smoothed or rescaled.

     warm repeat; all three answers correct; slowest engine 2-5 s; this engine and the fastest baseline within 5% tokens;
     ratio closest to this run's 6-prompt ratio. The length rule was relaxed to this form after the capture was seen:
     the strict form (all three within 5%) left only gsm108 (1.39 s race, 1.18x). The pick, gsm150, runs 1.51x vs SGLang,
     above the run's 6-prompt 1.39x; the scene states both. -->
