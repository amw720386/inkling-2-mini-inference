<!doctype html>
<!-- GitHub social preview (Settings > Social preview), 1280 x 640:
     node render.js scenes/social-preview.html <dir> --w 1280 --h 640 --stills 1
     Facts: README.md and docs/architecture.md (26B looped MoE, 3.4B active per token, peak 28.8 GiB, 4 x 32k or 256k
     context). Glyph: the 24 stored layers as columns of tiles, prelude 0-5, loop core 6-17 (run three times), coda 18-23. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../theme.css">
<style>
  html, body { margin: 0; background: var(--bg); width: 1280px; height: 640px; overflow: hidden; }
  #wrap { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .label { font-size: 13px; }
  #head { margin-top: 20px; font: 300 44px/1.13 var(--sans); color: var(--text); letter-spacing: -0.015em; }
  #ctx { margin-top: 24px; font: 300 19px/1.5 var(--sans); color: var(--body); }
  #url { margin-top: 34px; font: 400 18px/1 var(--mono); color: var(--text); }
  #glyph { position: absolute; right: 72px; top: 50%; transform: translateY(-50%); }
  #glyph svg { display: block; overflow: visible; }
</style></head>
<body>
<div id="wrap">
  <div class="label">Inkling-2-Mini · one GPU, under 32 GB</div>
  <div id="head">A single-GPU inference engine for a 26B looped MoE.</div>
  <div id="ctx">Python and Triton. Fused kernels, CUDA graphs and DSpark speculative decoding; four 32k contexts, or 256k on one card.</div>
  <div id="url">github.com/amw720386/inkling-2-mini-inference</div>
</div>
<div id="glyph"></div>
<script src="../lib/scene.js"></script>
<script>
  const css = n => getComputedStyle(document.documentElement).getPropertyValue('--' + n).trim();
  const C = { blue: css('blue'), orange: css('orange'), grey: css('grey'), muted: css('muted'), dim: css('dim') };
  const NS = 'http://www.w3.org/2000/svg', mk = (tag, a, txt) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt) e.textContent = txt; return e };
  // 24 layer columns x 16 tiles, groups 6 | 12 | 6. A few tiles per column lit blue (active experts); deterministic.
  const T = 11, G = 3, GAP = 14, ROWS = 16, groups = [6, 12, 6];
  const W = 24 * (T + G) - G + 2 * GAP, H = ROWS * (T + G) - G;
  const svg = mk('svg', { width: W, height: H + 64, viewBox: `0 -40 ${W} ${H + 64}` });
  let a = 0x2545f491;
  const rnd = () => { a ^= a << 13; a >>>= 0; a ^= a >>> 17; a ^= a << 5; a >>>= 0; return a / 4294967296 };
  let col = 0, x0 = 0;
  groups.forEach((n, gi) => {
    const loop = gi === 1, gx = x0;
    for (let c = 0; c < n; c++, col++) {
      const lit = new Set(); while (lit.size < 2) lit.add(Math.floor(rnd() * ROWS));
      for (let r = 0; r < ROWS; r++) {
        const on = lit.has(r);
        svg.appendChild(mk('rect', { x: x0 + c * (T + G), y: r * (T + G), width: T, height: T, rx: 2,
          fill: on ? C.blue : (loop ? C.orange : C.grey), opacity: on ? 1 : (loop ? 0.22 : 0.2) }));
      }
    }
    const gw = n * (T + G) - G;
    svg.appendChild(mk('text', { x: gx + gw / 2, y: H + 22, 'text-anchor': 'middle', fill: loop ? C.orange : C.muted,
      'font-family': 'JBMono', 'font-size': 11, 'letter-spacing': 2.2 }, ['PRELUDE', 'LOOP × 3', 'CODA'][gi]));
    if (loop) {   // the loop core runs three times: an arc back over it
      svg.appendChild(mk('path', { d: `M${gx + gw - 4} -6 C ${gx + gw - 4} -34, ${gx + 4} -34, ${gx + 4} -10`, fill: 'none', stroke: C.orange, 'stroke-width': 1.6 }));
      svg.appendChild(mk('path', { d: `M${gx} -15 L${gx + 4} -6 L${gx + 8} -15 Z`, fill: C.orange }));
    }
    x0 += n * (T + G) - G + GAP + G;
  });
  document.getElementById('glyph').appendChild(svg);
  window.SCENE = { duration: 1 };
  window.renderFrame = () => {};
</script>
</body></html>
