<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scene 4: 32 GB on one card</title>
<link rel="stylesheet" href="../theme.css">
<style>
  html, body { margin: 0; width: var(--W); height: var(--H); background: var(--bg); overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; }
  #text { position: absolute; left: 64px; right: 64px; bottom: 64px; }
  #text .label { margin-bottom: 20px; }
  .swap { position: relative; height: 53px; }
  .swap > div { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; }
  .subs { position: relative; height: 30px; margin-top: 14px; }
  .subs > div { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; font-variant-numeric: tabular-nums; }
  .subs code { font-family: var(--mono); font-size: 0.9em; color: var(--text); }
  /* segment labels: one baseline under the slab, each with its own leader line */
  #leaders { position: absolute; left: 0; top: 0; overflow: visible; }
  .seg { position: absolute; transform: translateX(-50%); white-space: nowrap; text-align: center; }
  .seg .label { color: #aab6c8; }
  .seg .v { font: 400 15px/1.2 var(--mono); color: var(--text); margin-top: 6px; letter-spacing: 0.08em; }
  .seg.kv .label, .seg.kv .v { color: var(--blue-glow); }
  /* slot numbers on top of the slab */
  .slot { position: absolute; transform: translate(-50%, -100%); font: 500 15px/1 var(--mono); color: var(--blue-glow); letter-spacing: 0.1em; white-space: nowrap; }
</style>
<script src="../lib/scene.js"></script>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js",
               "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<svg id="leaders"></svg>
<div id="tags"></div>
<div id="text">
  <div class="label" id="kicker">32 GB · one card</div>
  <div class="swap"><div class="headline" id="h1">Four 32k contexts in 32 GB.</div><div class="headline" id="h2">Or 256k on one card.</div></div>
  <div class="subs"><div class="sub" id="s1">26.4 GiB after start · 28.8 GiB peak</div><div class="sub" id="s2">25.3 / 28.6 GiB with <code>--kv-fp8</code></div></div>
</div>
<script type="module" src="memory.js"></script>
</body>
</html>
